name: Publish template to BVGeert

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: production
            host: geert.link
            secret: BVG_TEMPLATE_TOKEN_GEERT_LINK
          - env: production
            host: nm.nu
            secret: BVG_TEMPLATE_TOKEN_NM_NU
          - env: staging
            host: staging.geert.link
            secret: BVG_TEMPLATE_TOKEN_GEERT_LINK_STAGING
          - env: staging
            host: staging.nm.nu
            secret: BVG_TEMPLATE_TOKEN_NM_NU_STAGING
          - env: accept
            host: accept.geert.link
            secret: BVG_TEMPLATE_TOKEN_GEERT_LINK_ACCEPT
          - env: accept
            host: accept.nm.nu
            secret: BVG_TEMPLATE_TOKEN_NM_NU_ACCEPT
    name: Publish → ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish to ${{ matrix.host }}
        uses: ./.github/actions/publish-template
        with:
          host: ${{ matrix.host }}
          token: ${{ secrets[matrix.secret] }}
          protocol: https
